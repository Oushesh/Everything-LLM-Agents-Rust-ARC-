[package]
name = "habit_server"
version = "0.1.0"
edition = "2024"

[dependencies]
habit_core = { path = "../habit_core" }
axum = "0.8"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tower-http = { version = "0.6", features = ["cors"] }