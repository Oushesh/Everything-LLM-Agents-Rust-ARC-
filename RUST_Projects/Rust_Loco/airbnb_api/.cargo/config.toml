[env]
# `cargo test` writes ts-rs bindings here. `relative` is from the directory
# that contains this `.cargo` folder (the `airbnb_api` crate root).
TS_RS_EXPORT_DIR = { value = "../staycore-web/src/types/generated", relative = true }
# JSON has no bigint. The API sends i64 fields as JSON numbers.
TS_RS_LARGE_INT = "number"

[alias]
loco = "run --"
loco-tool = "run --"

playground = "run --example playground"

# https://github.com/rust-lang/rust/issues/141626
# (can be removed once link.exe is fixed)
[target.x86_64-pc-windows-msvc]
linker = "rust-lld"
